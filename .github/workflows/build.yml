name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release for the version in Directory.Build.props'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # self-test screenshots that are attached to the release under these names (README shows them)
  README_SHOTS: 06-ai-diff=folio.png 07-reader-book=folio-reader.png 03-encoding-menu=folio-encodings.png 04-coder-graphite=folio-dark.png 10-glass=folio-glass.png

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the UI (web → web/dist)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node build.mjs --strict

      - name: Unit tests
        run: dotnet test tests/Folio.Core.Tests -c Release --nologo

      - name: Publish Folio.exe
        run: dotnet publish src/Folio/Folio.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out --nologo

      - name: Self-test (UI tour + window checks, screenshots)
        id: selftest
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out\Folio.exe -ArgumentList '--selftest=selftest','--selftest-lang=en' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(480000)) { Stop-Process -Id $p.Id -Force; "code=timeout" >> $env:GITHUB_OUTPUT; Write-Host 'self-test timed out'; exit 0 }
          $code = $p.ExitCode
          "code=$code" >> $env:GITHUB_OUTPUT
          if (Test-Path selftest\summary.txt) { Get-Content selftest\summary.txt; Get-Content selftest\summary.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          Write-Host "exit code: $code"
          exit 0

      - name: Upload self-test results (pre-release "ci-selftest")
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path selftest)) { New-Item -ItemType Directory selftest | Out-Null }
          if (-not (Test-Path selftest\summary.txt)) { 'no summary' | Out-File -Encoding utf8 selftest\summary.txt }
          Compress-Archive -Path selftest\* -DestinationPath selftest.zip -Force
          gh release delete ci-selftest --yes --cleanup-tag 2>$null
          $files = @(Get-ChildItem selftest -Filter *.png | ForEach-Object FullName) + @('selftest.zip')
          if (Test-Path selftest\report.json) { $files += 'selftest\report.json' }
          $files += 'selftest\summary.txt'
          gh release create ci-selftest @files --prerelease --title "CI self-test" --notes-file selftest\summary.txt --target $env:GITHUB_SHA
          exit 0

      - name: Stop when the self-test failed
        if: steps.selftest.outputs.code != '0'
        run: |
          echo "Self-test failed (code ${{ steps.selftest.outputs.code }})"
          exit 1

      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash out\Folio.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", "$h  Folio.exe`n")
          Get-Content SHA256SUMS.txt
          "Folio.exe: $([math]::Round((Get-Item out\Folio.exe).Length / 1MB, 1)) MB, SHA-256 $h" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Release
        if: contains(github.event.head_commit.message, '[release]') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tag = "v$ver"
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($ver))\]?[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Folio $ver" }
          $notes += "`n`n**Download:** Folio.exe (Windows 10/11 x64, one file, no installer). SHA-256: see SHA256SUMS.txt."
          [IO.File]::WriteAllText("$PWD\notes.md", $notes)
          $assets = @('out\Folio.exe', 'SHA256SUMS.txt')
          foreach ($pair in $env:README_SHOTS -split ' ') {
            $src, $dst = $pair -split '='
            if (Test-Path "selftest\$src.png") { Copy-Item "selftest\$src.png" $dst; $assets += $dst }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release edit $tag --notes-file notes.md --latest
          } else {
            gh release create $tag @assets --title "Folio $ver" --notes-file notes.md --target $env:GITHUB_SHA --latest
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the CI pre-releases are only needed until a real release exists
          foreach ($t in 'ci-selftest', 'ci-probe') { gh release delete $t --yes --cleanup-tag 2>$null }
          exit 0
