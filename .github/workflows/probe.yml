name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml', 'ci/probe.ps1']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe environment
        shell: pwsh
        run: ./ci/probe.ps1
      - name: Publish probe results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-probe --yes --cleanup-tag 2>$null
          $files = @('probe.txt'); if (Test-Path probe-screen.png) { $files += 'probe-screen.png' }
          gh release create ci-probe @files --prerelease --title "CI probe" --notes "temporary" --target $env:GITHUB_SHA
          exit 0
