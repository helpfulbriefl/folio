name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Language regression tests
        working-directory: web
        run: npm test
      - name: Strict UI build
        working-directory: web
        run: node build.mjs --strict
      - name: Core unit tests
        run: dotnet test tests/Folio.Core.Tests -c Release --nologo
      - name: Compile Windows application
        run: dotnet build src/Folio/Folio.csproj -c Release --nologo
